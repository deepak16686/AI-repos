<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 780" width="1760" height="780" font-family="Arial, Helvetica, sans-serif">
<title>Analysis run state machine</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<style>
.ar{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arr)}
.ar2{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arr);marker-start:url(#arr)}
.ds{stroke:#64748b;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#arr)}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round}
</style>
</defs>
<rect width="1760" height="780" fill="#ffffff"/>
<text x="30" y="30" font-size="22" fill="#111827" text-anchor="start" font-weight="700">State machine of one analysis run</text>
<text x="30" y="50" font-size="12" fill="#475569" text-anchor="start" >Persisted in ai-postgres (analysis_runs.status). Every transition writes an audit row. Retries re-enter the queue; nothing loops forever.</text>
<rect x="20" y="130" width="150" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="95.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">RECEIVED</text><text x="95.0" y="176" font-size="10" fill="#475569" text-anchor="middle">webhook accepted</text>
<rect x="245" y="130" width="150" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">QUEUED</text><text x="320.0" y="176" font-size="10" fill="#475569" text-anchor="middle">in Redis stream</text>
<rect x="470" y="130" width="150" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="545.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">COLLECTING</text><text x="545.0" y="176" font-size="10" fill="#475569" text-anchor="middle">tools + log slicing</text>
<rect x="695" y="130" width="150" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="770.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">REASONING</text><text x="770.0" y="176" font-size="10" fill="#475569" text-anchor="middle">LLM loop</text>
<rect x="920" y="130" width="150" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="995.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">VALIDATING</text><text x="995.0" y="176" font-size="10" fill="#475569" text-anchor="middle">citations + schema</text>
<rect x="1145" y="130" width="150" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1220.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">DRAFTED</text><text x="1220.0" y="176" font-size="10" fill="#475569" text-anchor="middle">note rendered</text>
<rect x="1370" y="130" width="150" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1445.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">PUBLISHED</text><text x="1445.0" y="176" font-size="10" fill="#475569" text-anchor="middle">MR note posted</text>
<rect x="1595" y="130" width="150" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1670.0" y="157" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">CLOSED</text><text x="1670.0" y="176" font-size="10" fill="#475569" text-anchor="middle">feedback or TTL</text>
<rect x="20" y="330" width="150" height="64" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="95.0" y="357" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">SKIPPED</text><text x="95.0" y="376" font-size="10" fill="#475569" text-anchor="middle">filtered out</text>
<rect x="582" y="330" width="150" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="657.0" y="357" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">FAILED_RETRYABLE</text><text x="657.0" y="376" font-size="10" fill="#475569" text-anchor="middle">timeout / error</text>
<rect x="920" y="330" width="150" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="995.0" y="357" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">NEEDS_HUMAN</text><text x="995.0" y="376" font-size="10" fill="#475569" text-anchor="middle">low confidence</text>
<rect x="582" y="520" width="150" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="657.0" y="547" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">FAILED_FINAL</text><text x="657.0" y="566" font-size="10" fill="#475569" text-anchor="middle">retries exhausted</text>
<rect x="1145" y="520" width="150" height="64" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1220.0" y="547" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">SHADOW_DONE</text><text x="1220.0" y="566" font-size="10" fill="#475569" text-anchor="middle">shadow: no publish</text>
<text x="30" y="700" font-size="12" fill="#1f2937" text-anchor="start" >Terminal states: CLOSED, SKIPPED, SHADOW_DONE, FAILED_FINAL.</text>
<text x="30" y="720" font-size="12" fill="#1f2937" text-anchor="start" >Re-analysis (pipeline retried and fails again) creates a NEW run that updates the same MR note through its hidden marker.</text>
<path d="M170,174 L245,174" class="ar"/>
<text x="207.5" y="164" font-size="10" fill="#475569" text-anchor="middle" >accepted</text>
<path d="M395,174 L470,174" class="ar"/>
<text x="432.5" y="152" font-size="10" fill="#475569" text-anchor="middle" >worker</text>
<text x="432.5" y="164" font-size="10" fill="#475569" text-anchor="middle" >claims</text>
<path d="M620,174 L695,174" class="ar"/>
<text x="657.5" y="152" font-size="10" fill="#475569" text-anchor="middle" >evidence</text>
<text x="657.5" y="164" font-size="10" fill="#475569" text-anchor="middle" >ready</text>
<path d="M845,174 L920,174" class="ar"/>
<text x="882.5" y="152" font-size="10" fill="#475569" text-anchor="middle" >final</text>
<text x="882.5" y="164" font-size="10" fill="#475569" text-anchor="middle" >answer</text>
<path d="M1070,174 L1145,174" class="ar"/>
<text x="1107.5" y="152" font-size="10" fill="#475569" text-anchor="middle" >citations</text>
<text x="1107.5" y="164" font-size="10" fill="#475569" text-anchor="middle" >valid</text>
<path d="M1295,174 L1370,174" class="ar"/>
<text x="1332.5" y="152" font-size="10" fill="#475569" text-anchor="middle" >mode =</text>
<text x="1332.5" y="164" font-size="10" fill="#475569" text-anchor="middle" >comment</text>
<path d="M1520,174 L1595,174" class="ar"/>
<text x="1557.5" y="152" font-size="10" fill="#475569" text-anchor="middle" >feedback /</text>
<text x="1557.5" y="164" font-size="10" fill="#475569" text-anchor="middle" >14 days</text>
<path d="M95.0,194 L95.0,330" class="ar"/><text x="103.0" y="245" font-size="10" fill="#475569" text-anchor="start" >not failed · not onboarded</text><text x="103.0" y="259" font-size="10" fill="#475569" text-anchor="start" >duplicate · prod pipeline</text>
<path d="M622,194 L622,330" class="ar"/>
<text x="616" y="245" font-size="10" fill="#475569" text-anchor="end" >tool error</text><text x="616" y="259" font-size="10" fill="#475569" text-anchor="end" >or timeout</text>
<path d="M692,194 L692,330" class="ar"/><text x="700" y="245" font-size="10" fill="#475569" text-anchor="start" >LLM timeout or</text><text x="700" y="259" font-size="10" fill="#475569" text-anchor="start" >provider error</text>
<path d="M582,362 L320.0,362 L320.0,194" class="ar"/><text x="330.0" y="354" font-size="10" fill="#475569" text-anchor="start" class="halo">retry ≤ 2 with backoff</text>
<path d="M657.0,394 L657.0,520" class="ar"/><text x="665.0" y="450" font-size="10" fill="#475569" text-anchor="start" >retries exhausted / fatal error</text>
<path d="M995.0,194 L995.0,330" class="ar"/><text x="1003.0" y="245" font-size="10" fill="#475569" text-anchor="start" >invalid citations or</text><text x="1003.0" y="259" font-size="10" fill="#475569" text-anchor="start" >low confidence</text>
<path d="M1070,362 L1405.0,362 L1405.0,194" class="ar"/><text x="1316" y="354" font-size="10" fill="#475569" text-anchor="middle" class="halo">publish 'needs human' note</text>
<path d="M1220.0,194 L1220.0,520" class="ar"/><text x="1228.0" y="470" font-size="10" fill="#475569" text-anchor="start" >mode = shadow:</text><text x="1228.0" y="484" font-size="10" fill="#475569" text-anchor="start" >analysis kept, nothing posted</text>
<path d="M657.0,584 L657.0,620 L1485.0,620 L1485.0,194" class="ds"/><text x="1000" y="612" font-size="10" fill="#475569" text-anchor="middle" class="halo">optional: short 'analysis failed, please triage manually' note</text>
</svg>
